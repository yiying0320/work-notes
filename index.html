<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>工作小記事</title>
<style>
:root{--bg:#fbf6fd;--surface:#fff;--sunk:#f7f0fb;--line:#eedff5;--line-strong:#e0cbeb;--ink:#4b3a5e;--muted:#9a87ad;--accent:#9b6fd6;--accent-soft:#efe4fb;--pink:#f08fb3;--bad:#d65b7f;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1724;--surface:#261f30;--sunk:#2d2539;--line:#3a3048;--line-strong:#4a3e5b;--ink:#f1e8f7;--muted:#ab9bbd;--accent:#c4a2f2;--accent-soft:#3a2d4f;--pink:#f5a3c4;--bad:#f39ab6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1724;--surface:#261f30;--sunk:#2d2539;--line:#3a3048;--line-strong:#4a3e5b;--ink:#f1e8f7;--muted:#ab9bbd;--accent:#c4a2f2;--accent-soft:#3a2d4f;--pink:#f5a3c4;--bad:#f39ab6;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  background-image:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0);background-size:22px 22px;display:grid;place-items:center;padding:16px}
.box{width:min(360px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 24px;box-shadow:0 2px 4px rgb(155 111 214/.06),0 10px 24px rgb(155 111 214/.1);display:flex;flex-direction:column;gap:14px;text-align:center}
.logo{width:56px;height:56px;margin:0 auto}
h1{margin:0;font-size:1.4rem;letter-spacing:.04em}
h1 span{color:var(--pink);font-size:.9rem;vertical-align:super}
p{margin:0;color:var(--muted);font-size:.86rem}
form{display:flex;flex-direction:column;gap:10px;text-align:left}
input[type=password]{font:inherit;font-size:1rem;color:var(--ink);background:var(--sunk);border:1.5px solid transparent;border-radius:14px;padding:11px 14px;width:100%}
input[type=password]:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
label.rem{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--muted);cursor:pointer}
button{font:inherit;font-weight:500;border:0;border-radius:999px;padding:10px;color:#fff;cursor:pointer;background:linear-gradient(120deg,var(--pink),var(--accent));box-shadow:0 4px 12px rgb(240 143 179/.3)}
button:disabled{opacity:.6;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{min-height:1.3em;font-size:.84rem;color:var(--bad);text-align:center}
.msg.ok{color:var(--muted)}
</style>
</head>

  <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">

    <path d="M22.3 23.4q1.7 1.4 3.4 0" fill="none" stroke="#4b3a5e" stroke-width="1.2" stroke-linecap="round"/>
    <ellipse cx="17.6" cy="23.6" rx="2" ry="1.2" fill="#f7a8c4"/><ellipse cx="30.4" cy="23.6" rx="2" ry="1.2" fill="#f7a8c4"/>
  </svg>
  <h1>工作小記事<span>✦</span></h1>
  <p>請輸入密碼開啟</p>
  <form id="f">
    <input type="password" id="pw" autocomplete="current-password" placeholder="密碼" aria-label="密碼" required autofocus>
    <label class="rem"><input type="checkbox" id="rem"> 記住這台裝置</label>
    <button type="submit" id="go">登入</button>
  </form>
  <div class="msg" id="msg" role="status"></div>
</main>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY = "wk-key-" + P.s;
const $ = id => document.getElementById(id);
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} }, del(k){ try { localStorage.removeItem(k); } catch {} } };

async function derive(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", salt:b64(P.s), iterations:P.n, hash:"SHA-256"}, base, 256));
}
async function open(raw){
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const gz = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.i)}, key, b64(P.c));
  const html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  document.open(); document.write(html); document.close();
}
const saved = store.get(KEY);
if (saved) open(b64(saved)).catch(() => store.del(KEY));

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = $("pw").value; if (!pw) return;
  $("go").disabled = true; $("msg").className = "msg ok"; $("msg").textContent = "解鎖中…";
  let raw;
  try { raw = await derive(pw); } catch { $("msg").className = "msg"; $("msg").textContent = "這個瀏覽器不支援解密，請換新版 Chrome、Edge 或 Safari。"; $("go").disabled = false; return; }
  try {
    if ($("rem").checked) store.set(KEY, btoa(String.fromCharCode(...raw)));
    await open(raw);
  } catch {
    store.del(KEY);
    $("msg").className = "msg"; $("msg").textContent = "密碼不正確，請再試一次";
    $("go").disabled = false; $("pw").select();
  }
});
})();
</script>
