<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>工作小記事</title>
<style>
:root{--bg:#fbf6fd;--bg2:#fde9f2;--surface:#fff;--sunk:#f7f0fb;--line:#eedff5;--line-strong:#e0cbeb;--ink:#4b3a5e;--muted:#9a87ad;--accent:#9b6fd6;--accent-soft:#efe4fb;--pink:#f08fb3;--pink-soft:#fde5ef;--bad:#d65b7f;--tooth:#fff;--face:#4b3a5e;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1724;--bg2:#2a1a2b;--surface:#261f30;--sunk:#2d2539;--line:#3a3048;--line-strong:#4a3e5b;--ink:#f1e8f7;--muted:#ab9bbd;--accent:#c4a2f2;--accent-soft:#3a2d4f;--pink:#f5a3c4;--pink-soft:#4a2b3c;--bad:#f39ab6;--tooth:#fdf8ff;--face:#4b3a5e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1724;--bg2:#2a1a2b;--surface:#261f30;--sunk:#2d2539;--line:#3a3048;--line-strong:#4a3e5b;--ink:#f1e8f7;--muted:#ab9bbd;--accent:#c4a2f2;--accent-soft:#3a2d4f;--pink:#f5a3c4;--pink-soft:#4a2b3c;--bad:#f39ab6;--tooth:#fdf8ff;--face:#4b3a5e;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font:15px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  background:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0) 0 0/22px 22px,linear-gradient(160deg,var(--bg) 40%,var(--bg2));
  display:grid;place-items:center;padding:16px;overflow:hidden}

/* floating bits */
.bits{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.bits span{position:absolute;bottom:-40px;font-size:var(--s);color:var(--c);opacity:0;animation:rise var(--d) linear var(--dl) infinite}
@keyframes rise{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:.85}50%{transform:translate(var(--x),-55vh) rotate(160deg)}90%{opacity:.6}100%{transform:translate(0,-110vh) rotate(320deg);opacity:0}}

.box{position:relative;width:min(360px,100%);background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:22px 24px 26px;
  box-shadow:0 2px 4px rgb(155 111 214/.06),0 18px 40px rgb(155 111 214/.16);display:flex;flex-direction:column;gap:12px;text-align:center;
  animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(.85) translateY(20px);opacity:0}}
.box.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.box.bye{animation:bye .5s ease-in forwards}
@keyframes bye{to{transform:scale(1.06);opacity:0}}

/* mascot */
.mascot{width:128px;height:142px;margin:-6px auto -4px;overflow:visible;cursor:pointer}
.mascot .bob{animation:bob 2.6s ease-in-out infinite;transform-origin:60px 100px}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
.mascot .shadow{fill:var(--accent);opacity:.14;animation:shadow 2.6s ease-in-out infinite;transform-origin:60px 92px}
@keyframes shadow{50%{transform:scaleX(.8);opacity:.08}}
.mascot .body{fill:var(--tooth);stroke:var(--accent);stroke-width:4.2;stroke-linejoin:round}
.mascot .eyes{transition:transform .15s ease-out}
.mascot .eye{fill:var(--face);transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.mascot .eye-hi{fill:#fff}
@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
.mascot .cheek{fill:#f7a8c4;transition:opacity .3s}
.mascot .mouth{fill:none;stroke:var(--face);stroke-width:2.6;stroke-linecap:round;transition:opacity .2s}
.mascot .m-sad,.mascot .m-happy,.mascot .closed,.mascot .sweat{opacity:0}
.mascot .m-happy{fill:#e86a95;stroke:var(--face)}
.mascot .closed{fill:none;stroke:var(--face);stroke-width:2.6;stroke-linecap:round}
.mascot .hand{fill:var(--tooth);stroke:var(--accent);stroke-width:3;transform-box:fill-box;transform-origin:center;
  transform:translateY(40px) scale(.6);opacity:0;transition:transform .35s cubic-bezier(.3,1.5,.5,1),opacity .2s}
.mascot .sweat{fill:#8cc3ea}
.mascot .spark{fill:var(--pink);transform-box:fill-box;transform-origin:center;animation:twinkle 1.8s ease-in-out infinite}
.mascot .spark.s2{fill:var(--accent);animation-delay:.9s}
@keyframes twinkle{50%{transform:scale(.4) rotate(45deg);opacity:.4}}
/* states */
.mascot.shy .hand{transform:none;opacity:1}
.mascot.shy .hand.r{transition-delay:.05s}
.mascot.shy .cheek{opacity:1;animation:blush 1s ease-in-out infinite}
@keyframes blush{50%{opacity:.55}}
.mascot.sad .m-smile,.mascot.happy .m-smile{opacity:0}
.mascot.sad .m-sad,.mascot.sad .sweat{opacity:1}
.mascot.sad .sweat{animation:drip 1s ease-in infinite}
@keyframes drip{from{transform:translateY(-3px)}to{transform:translateY(4px);opacity:0}}
.mascot.sad .bob{animation:none}
.mascot.happy .m-happy,.mascot.happy .closed{opacity:1}
.mascot.happy .eyes{opacity:0}
.mascot.happy .bob{animation:jump .55s cubic-bezier(.3,1.6,.5,1) 2}
@keyframes jump{50%{transform:translateY(-22px) rotate(4deg) scale(1.05)}}
.mascot.wiggle .bob{animation:wiggle .5s}
@keyframes wiggle{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}

h1{margin:0;font-size:1.45rem;letter-spacing:.06em;display:flex;justify-content:center}
h1 i{font-style:normal;display:inline-block;animation:wave 2.8s ease-in-out infinite;animation-delay:calc(var(--n)*.12s)}
h1 i.star{color:var(--pink);font-size:.9rem;align-self:flex-start;margin-left:3px}
@keyframes wave{0%,40%,100%{transform:translateY(0)}20%{transform:translateY(-5px)}}
p.sub{margin:-6px 0 0;color:var(--muted);font-size:.86rem;min-height:1.4em}
form{display:flex;flex-direction:column;gap:10px;text-align:left}
.field{position:relative}
input[type=password],input[type=text]{font:inherit;font-size:1.05rem;letter-spacing:.1em;color:var(--ink);background:var(--sunk);border:2px solid transparent;border-radius:16px;padding:11px 46px 11px 16px;width:100%;transition:border-color .2s,background .2s,box-shadow .2s}
input:focus{outline:none;border-color:var(--pink);background:var(--surface);box-shadow:0 0 0 4px var(--pink-soft)}
.peek{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:1.15rem;cursor:pointer;padding:6px;border-radius:10px;line-height:1}
.peek:hover{background:var(--accent-soft)}
.pop{position:absolute;pointer-events:none;color:var(--pink);font-size:.9rem;animation:popup .7s ease-out forwards}
@keyframes popup{from{transform:translate(-50%,0) scale(.5);opacity:1}to{transform:translate(-50%,-34px) scale(1.2);opacity:0}}
label.rem{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--muted);cursor:pointer;user-select:none}
label.rem input{accent-color:var(--pink);width:16px;height:16px}
button.go{position:relative;overflow:hidden;font:inherit;font-weight:700;letter-spacing:.2em;border:0;border-radius:999px;padding:11px;color:#fff;cursor:pointer;
  background:linear-gradient(120deg,var(--pink),var(--accent));box-shadow:0 6px 16px rgb(240 143 179/.35);transition:transform .15s,box-shadow .15s}
button.go::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgb(255 255 255/.45) 50%,transparent 70%);transform:translateX(-100%);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
button.go:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgb(240 143 179/.4)}
button.go:active{transform:translateY(1px) scale(.98)}
button.go:disabled{cursor:default;transform:none}
.dots i{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:#fff;animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{40%{transform:translateY(-5px)}}
button:focus-visible,input:focus-visible,.peek:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{min-height:1.3em;font-size:.86rem;color:var(--bad);text-align:center}
.msg.ok{color:var(--muted)}
.burst{position:fixed;pointer-events:none;font-size:var(--s);color:var(--c);left:50%;top:var(--y);animation:burst .9s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes burst{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--yy))) scale(1) rotate(var(--r));opacity:0}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.bits{display:none}}
</style>
</head>

  <h1 aria-label="工作小記事"><i style="--n:0">工</i><i style="--n:1">作</i><i style="--n:2">小</i><i style="--n:3">記</i><i style="--n:4">事</i><i class="star" style="--n:5">✦</i></h1>

    <div class="field" id="field">
      <input type="password" id="pw" autocomplete="current-password" placeholder="密碼" aria-label="密碼" required autofocus>

</main>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY = "wk-key-" + P.s;
const $ = id => document.getElementById(id);
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} }, del(k){ try { localStorage.removeItem(k); } catch {} } };
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait = ms => new Promise(r => setTimeout(r, calm ? 0 : ms));
const M = $("mascot"), pw = $("pw");
const BITS = ["♥","✦","✿","♡","⋆"], COLORS = ["var(--pink)","var(--accent)","#f7a8c4","#c8a8f0"];
const pick = a => a[Math.floor(Math.random() * a.length)];

// drifting hearts & sparkles
if (!calm) for (let i = 0; i < 16; i++){
  const s = document.createElement("span");
  s.textContent = pick(BITS);
  s.style.cssText = `left:${Math.random()*100}%;--s:${10+Math.random()*16}px;--c:${pick(COLORS)};--d:${9+Math.random()*9}s;--dl:${-Math.random()*16}s;--x:${(Math.random()-.5)*80}px`;
  $("bits").appendChild(s);
}

// mascot: eyes follow the pointer, covers its eyes while you type, peeks when shown
const setState = s => { M.classList.remove("shy","sad","happy"); if (s) M.classList.add(s); };
let showing = false;
const shy = () => setState(document.activeElement === pw && !showing ? "shy" : "");
addEventListener("pointermove", e => {
  if (calm) return;
  const r = M.getBoundingClientRect(), dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height*.4);
  const d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 200) * 3;
  $("eyes").style.transform = `translate(${dx/d*k}px,${dy/d*k}px)`;
});
pw.addEventListener("focus", shy);
shy();
pw.addEventListener("blur", () => setTimeout(shy, 0));
$("peek").addEventListener("click", () => {
  showing = !showing;
  pw.type = showing ? "text" : "password";
  $("peek").textContent = showing ? "🐵" : "🙈";
  $("peek").setAttribute("aria-label", showing ? "隱藏密碼" : "顯示密碼");
  $("sub").textContent = showing ? "好啦，我看一下下 👀" : "輸入密碼，我會偷偷不看 ♡";
  pw.focus(); shy();
});
M.addEventListener("click", () => { if (calm) return; M.classList.remove("wiggle"); void M.getBBox(); M.classList.add("wiggle"); setTimeout(() => M.classList.remove("wiggle"), 500); });
pw.addEventListener("input", e => {
  if (calm || e.inputType === "deleteContentBackward") return;
  if (M.classList.contains("sad")) shy();
  const p = document.createElement("span");
  p.className = "pop"; p.textContent = pick(BITS);
  p.style.left = Math.min(88, 12 + pw.value.length * 6) + "%"; p.style.top = "4px";
  $("field").appendChild(p); setTimeout(() => p.remove(), 700);
});
function burst(){
  if (calm) return;
  const y = M.getBoundingClientRect().top + 60;
  for (let i = 0; i < 18; i++){
    const b = document.createElement("span"), a = Math.random() * Math.PI * 2, r = 70 + Math.random() * 90;
    b.className = "burst"; b.textContent = pick(BITS);
    b.style.cssText = `--y:${y}px;--x:${Math.cos(a)*r}px;--yy:${Math.sin(a)*r}px;--r:${(Math.random()-.5)*300}deg;--s:${12+Math.random()*14}px;--c:${pick(COLORS)}`;
    document.body.appendChild(b); setTimeout(() => b.remove(), 900);
  }
}
const busy = on => { $("go").disabled = on; $("go").innerHTML = on ? `<span class="dots"><i></i><i></i><i></i></span>` : "登入"; };

async function derive(p){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(p), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", salt:b64(P.s), iterations:P.n, hash:"SHA-256"}, base, 256));
}
async function decrypt(raw){
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const gz = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.i)}, key, b64(P.c));
  return new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
}
const show = html => { document.open(); document.write(html); document.close(); };
const saved = store.get(KEY);
if (saved) decrypt(b64(saved)).then(show, () => store.del(KEY));

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const p = pw.value; if (!p) return;
  busy(true); $("msg").className = "msg ok"; $("msg").textContent = "解鎖中…";
  let raw;
  try { raw = await derive(p); } catch { $("msg").className = "msg"; $("msg").textContent = "這個瀏覽器不支援解密，請換新版 Chrome、Edge 或 Safari。"; busy(false); return; }
  let html;
  try { html = await decrypt(raw); }
  catch {
    store.del(KEY); busy(false);
    setState("sad"); $("box").classList.remove("shake"); void $("box").offsetWidth; $("box").classList.add("shake");
    $("msg").className = "msg"; $("msg").textContent = "嗚嗚，密碼不對，再試一次 🥺";
    pw.select(); return;
  }
  if ($("rem").checked) store.set(KEY, btoa(String.fromCharCode(...raw)));
  try { sessionStorage.setItem("wk-pw", p); } catch {}
  pw.blur(); setState("happy"); $("msg").className = "msg ok"; $("msg").textContent = "歡迎回來 ♥"; burst();
  await wait(900); $("box").classList.add("bye"); await wait(400);
  show(html);
});
})();
</script>
